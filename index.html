<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Control remoto de luces</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; padding:20px; font-family:Arial,sans-serif; background:#101820; color:#fff; }
    main { max-width:850px; margin:auto; }
    h1 { margin-bottom:5px; } .sub { color:#b8c7d1; }
    .box,.card { background:#1d2b35; border-radius:14px; padding:18px; margin:15px 0; }
    .login { display:grid; gap:10px; max-width:420px; }
    input { border:1px solid #455a64; border-radius:8px; padding:12px; background:#101820; color:#fff; }
    button { border:0; border-radius:8px; padding:11px 15px; font-weight:bold; color:#fff; cursor:pointer; }
    .connect { background:#2563eb; } .on { background:#16a34a; } .off { background:#dc2626; }
    #estadoConexion { font-weight:bold; } .red { color:#f87171; } .green { color:#4ade80; } .yellow { color:#fde047; }
    #luces { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
    .card { margin:0; text-align:center; } .nombre { font-weight:bold; font-size:18px; } .estado { margin:10px; }
    .acciones { display:flex; justify-content:center; gap:8px; }
  </style>
</head>
<body>
<main>
  <h1>💡 Control remoto de luces</h1>
  <p class="sub">ESP32 mediante EMQX MQTT seguro</p>

  <section class="box" id="loginBox">
    <h2>Conectar</h2>
    <div class="login">
      <input id="usuario" placeholder="Usuario MQTT" autocomplete="username">
      <input id="password" type="password" placeholder="Contraseña MQTT" autocomplete="current-password">
      <button class="connect" onclick="conectar()">Conectar</button>
    </div>
  </section>

  <section class="box">
    <div id="estadoConexion" class="red">🔴 DESCONECTADO</div>
    <p id="contador">Esperando estado del ESP32…</p>
  </section>

  <section id="luces"></section>
</main>

<script>
  // Configuración fija: no aparece en pantalla.
  const BROKER_URL = "wss://a401161b.ala.us-east-1.emqxsl.com:8084/mqtt";
  const TOPIC_COMMAND = "SP/DOMOTICA/LUCES/comando";
  const TOPIC_STATE = "SP/DOMOTICA/LUCES/estado";
  const TOPIC_AVAILABILITY = "SP/DOMOTICA/LUCES/disponible";

  let client = null;
  let luces = [];

  function mostrarConexion(texto, clase) {
    const e = document.getElementById("estadoConexion");
    e.textContent = texto;
    e.className = clase;
  }

  function renderizar() {
    const encendidas = luces.filter(l => l.state).length;
    document.getElementById("contador").textContent =
      `${encendidas} / ${luces.length} luces encendidas`;

    document.getElementById("luces").innerHTML = luces.map(luz => `
      <article class="card">
        <div style="font-size:38px">💡</div>
        <div class="nombre">${luz.name}</div>
        <div class="estado ${luz.state ? "green" : "red"}">
          ${luz.state ? "🟢 ENCENDIDA" : "🔴 APAGADA"}
        </div>
        <div class="acciones">
          <button class="on" onclick="enviar(${luz.id},true)">ON</button>
          <button class="off" onclick="enviar(${luz.id},false)">OFF</button>
        </div>
      </article>
    `).join("");
  }

  function enviar(id, state) {
    if (!client || !client.connected) {
      alert("No hay conexión con EMQX.");
      return;
    }

    client.publish(
      TOPIC_COMMAND,
      JSON.stringify({ light: id, state: state ? "ON" : "OFF" }),
      { qos: 1, retain: false }
    );
  }

  function conectar() {
    const username = document.getElementById("usuario").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !password) {
      alert("Ingresa tu usuario y contraseña MQTT.");
      return;
    }

    if (client) client.end(true);

    mostrarConexion("🟡 CONECTANDO…", "yellow");

    client = mqtt.connect(BROKER_URL, {
      clientId: "panel-luces-" + Math.random().toString(16).slice(2),
      username,
      password,
      clean: true,
      reconnectPeriod: 4000,
      connectTimeout: 10000
    });

    client.on("connect", () => {
      mostrarConexion("🟢 CONECTADO A EMQX", "green");
      client.subscribe([TOPIC_STATE, TOPIC_AVAILABILITY], { qos: 1 });
    });

    client.on("reconnect", () => {
      mostrarConexion("🟡 RECONECTANDO…", "yellow");
    });

    client.on("close", () => {
      mostrarConexion("🔴 DESCONECTADO", "red");
    });

    client.on("error", error => console.error("MQTT:", error));

    client.on("message", (topic, data) => {
      const message = data.toString();

      if (topic === TOPIC_AVAILABILITY) {
        if (message === "offline") {
          mostrarConexion("🟠 ESP32 DESCONECTADO", "yellow");
        }
        return;
      }

      if (topic === TOPIC_STATE) {
        try {
          const estado = JSON.parse(message);
          if (Array.isArray(estado.lights)) {
            luces = estado.lights;
            renderizar();
          }
        } catch (error) {
          console.error("Estado recibido inválido:", error);
        }
      }
    });
  }
</script>
</body>
</html>
